name: Build and test EnTool (Go)

on:
  push:
    branches:
      - main
      - go-rewrite-validation
    paths:
      - '**.go'
      - go.mod
      - .github/workflows/build.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            exe: EnToolWindows.exe
            archive: EnToolWindows.exe
            artifact: windows
          - os: ubuntu-22.04
            label: Linux x64
            exe: EnToolLinux
            archive: EnToolLinux.tar.gz
            artifact: linux
          - os: macos-15-intel
            label: macOS Intel x64
            exe: EnToolMacOS
            archive: EnToolMacOS.tar.gz
            artifact: macos-intel
          - os: macos-15
            label: macOS Apple Silicon arm64
            exe: EnToolMacOSAppleSilicon
            archive: EnToolMacOSAppleSilicon.tar.gz
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -count=1 ./...
      - name: Build native executable without packers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.exe }}" .
      - name: Test startup and create archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = 'Windows' ]; then
            output=$(printf '0\n' | ./dist/EnToolWindows.exe)
            printf '%s\n' "$output" | grep -F 'by christofrancis'
            printf '%s\n' "$output" | grep -F 'Goodbye!'
            cp dist/EnToolWindows.exe staging/EnToolWindows.exe
          elif [ "$RUNNER_OS" = 'macOS' ]; then
            codesign --force --sign - "dist/${{ matrix.exe }}"
            output=$(printf '0\n' | "./dist/${{ matrix.exe }}")
            printf '%s\n' "$output" | grep -F 'by christofrancis'
            printf '%s\n' "$output" | grep -F 'Goodbye!'
            tar -czf "staging/${{ matrix.archive }}" -C dist "${{ matrix.exe }}"
          else
            output=$(printf '0\n' | "./dist/${{ matrix.exe }}")
            printf '%s\n' "$output" | grep -F 'by christofrancis'
            printf '%s\n' "$output" | grep -F 'Goodbye!'
            tar -czf "staging/${{ matrix.archive }}" -C dist "${{ matrix.exe }}"
          fi
          test -s "staging/${{ matrix.archive }}"
      - name: Preserve dependency checksums
        if: matrix.artifact == 'linux'
        shell: bash
        run: cp go.sum staging/go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: entool-${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  publish:
    name: Publish native downloads to main
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: entool-*
          path: downloads
          merge-multiple: true
      - name: Check file integrity
        shell: bash
        run: |
          set -euo pipefail
          for f in EnToolWindows.exe EnToolLinux.tar.gz EnToolMacOS.tar.gz EnToolMacOSAppleSilicon.tar.gz; do
            test -s "downloads/$f"
          done
          test -s downloads/go.sum
          cp downloads/go.sum go.sum
          rm downloads/go.sum
          tar -tzf downloads/EnToolLinux.tar.gz | grep -Fx EnToolLinux
          tar -tzf downloads/EnToolMacOS.tar.gz | grep -Fx EnToolMacOS
          tar -tzf downloads/EnToolMacOSAppleSilicon.tar.gz | grep -Fx EnToolMacOSAppleSilicon
          (cd downloads && sha256sum EnToolWindows.exe EnToolLinux.tar.gz EnToolMacOS.tar.gz EnToolMacOSAppleSilicon.tar.gz > SHA256SUMS)
          (cd downloads && sha256sum -c SHA256SUMS)
      - name: Commit release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.sum downloads/SHA256SUMS
          git add -f downloads/EnToolWindows.exe downloads/EnToolLinux.tar.gz downloads/EnToolMacOS.tar.gz downloads/EnToolMacOSAppleSilicon.tar.gz
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m 'Build Go executables for Windows Linux and macOS'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
