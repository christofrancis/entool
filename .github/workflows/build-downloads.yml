name: Build EnTool downloads

on:
  push:
    branches: [main]
    paths:
      - EnTool.py
      - requirements.txt
      - .github/workflows/build-downloads.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            executable: EnToolWindows
            artifact: windows
          - os: ubuntu-22.04
            executable: EnToolLinux
            artifact: linux
          - os: macos-15-intel
            executable: EnToolMacOS
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name ${{ matrix.executable }} EnTool.py
      - name: Test and package executable
        shell: bash
        run: |
          mkdir -p staging
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '0\n' | ./dist/EnToolWindows.exe | grep -F 'by christofrancis'
            cp dist/EnToolWindows.exe staging/EnToolWindows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --sign - dist/EnToolMacOS
            printf '0\n' | ./dist/EnToolMacOS | grep -F 'by christofrancis'
            tar -czf staging/EnToolMacOS.tar.gz -C dist EnToolMacOS
          else
            printf '0\n' | ./dist/EnToolLinux | grep -F 'by christofrancis'
            tar -czf staging/EnToolLinux.tar.gz -C dist EnToolLinux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: entool-${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  publish:
    name: Commit updated downloads
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: entool-*
          path: downloads
          merge-multiple: true
      - name: Commit binaries to main
        shell: bash
        run: |
          test -s downloads/EnToolWindows.exe
          test -s downloads/EnToolLinux.tar.gz
          test -s downloads/EnToolMacOS.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/EnToolWindows.exe downloads/EnToolLinux.tar.gz downloads/EnToolMacOS.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild EnTool downloads with startup banner'
            git push origin HEAD:main
          fi
