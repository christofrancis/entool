name: Build EnTool downloads

on:
  push:
    branches: [main]
    paths:
      - EnTool.py
      - requirements.txt
      - .github/workflows/build-downloads.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            executable: EnToolLinux
            artifact: linux
          - os: macos-15-intel
            executable: EnToolMacOS
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source
        run: python -m unittest discover -s tests -v

      - name: Build Linux/macOS single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name ${{ matrix.executable }} EnTool.py
      - name: Test and package Linux/macOS executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --sign - dist/EnToolMacOS
            printf '0\n' | ./dist/EnToolMacOS | grep -F 'by christofrancis'
            tar -czf staging/EnToolMacOS.tar.gz -C dist EnToolMacOS
          else
            printf '0\n' | ./dist/EnToolLinux | grep -F 'by christofrancis'
            tar -czf staging/EnToolLinux.tar.gz -C dist EnToolLinux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: entool-${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error

  publish:
    name: Commit updated downloads
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: entool-*
          path: downloads
          merge-multiple: true
      - name: Validate archives and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s downloads/EnToolLinux.tar.gz
          test -s downloads/EnToolMacOS.tar.gz
          tar -tzf downloads/EnToolLinux.tar.gz | grep -q 'EnToolLinux'
          tar -tzf downloads/EnToolMacOS.tar.gz | grep -q 'EnToolMacOS'
          (cd downloads && sha256sum EnToolLinux.tar.gz EnToolMacOS.tar.gz > SHA256SUMS)
          (cd downloads && sha256sum -c SHA256SUMS)
      - name: Commit packages to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/EnToolLinux.tar.gz downloads/EnToolMacOS.tar.gz downloads/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Linux and macOS packages with checksums'
            git push origin HEAD:main
          fi
